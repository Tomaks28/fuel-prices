# Bearer scanner configuration.
#
# `src/cli.ts` is a development harness that prints gas-station records to a
# terminal, which trips the "leakage of information in logger message" rule 18
# times over. The records are public open data — addresses and prices published
# by the French administration — there is no personal data and no credential in
# them, and the CLI is never published (it builds into the git-ignored
# `dist-cli/`). Scanning it reports nothing actionable, so it is skipped rather
# than the rule being disabled repository-wide, which would also silence it for
# the library code where it would matter.
skip-path:
  - src/cli.ts
