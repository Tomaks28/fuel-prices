version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Runtime bumps use `fix` so semantic-release ships a patch: they change
    # what consumers install. Dev tooling uses `chore`, which is not a
    # releasable type, so the toolchain can move without publishing.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # One PR for the whole dev toolchain instead of one per package.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - '*'
