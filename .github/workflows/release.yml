name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the changelog and version bump, create tags
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # mint the npm provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release reads the whole tag history
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Gate before publishing: a release must never ship code that fails
      # these. The build here runs again during `prepare`, once the version
      # bump has landed in package.json.
      - run: npm run check
      - run: npm run build:verify

      # Publishing is opt-in: set the RELEASE_ENABLED repository variable to
      # "true" when the package is ready to ship. Gating on the variable rather
      # than on NPM_TOKEN keeps trusted publishing viable, which authenticates
      # over OIDC and needs no secret at all.
      - name: Report that releasing is disabled
        if: vars.RELEASE_ENABLED != 'true'
        run: echo '::notice::RELEASE_ENABLED is not "true", skipping the release.'

      - name: Release
        if: vars.RELEASE_ENABLED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
