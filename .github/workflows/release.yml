name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the changelog and version bump, create tags
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # mint the npm provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release reads the whole tag history
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Gate before publishing: a release must never ship code that fails
      # these. The build here runs again during `prepare`, once the version
      # bump has landed in package.json.
      - run: npm run check
      - run: npm run build:verify

      # Without a token semantic-release fails in verifyConditions, which would
      # leave this workflow permanently red. Skip with a notice instead, and
      # start releasing on its own the moment the secret is added.
      - name: Check for an npm token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::NPM_TOKEN is not configured, skipping the release.'
          fi

      - name: Release
        if: steps.token.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
