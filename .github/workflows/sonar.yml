name: Sonar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs full history to attribute new code

      # SonarQube Cloud CI analysis requires a token, and requires Automatic
      # Analysis to be turned off in the project settings — the two cannot run
      # together. Skip with a notice until both are done.
      - name: Check for a Sonar token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::SONAR_TOKEN is not configured, skipping the Sonar analysis.'
          fi

      # Sonar reads the coverage from coverage/lcov.info, which the scanner does
      # not produce itself.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      # `--ignore-scripts`: this job only needs to run the test suite, so no
      # dependency has any business running install-time lifecycle scripts here.
      - name: Collect coverage
        if: steps.token.outputs.present == 'true'
        run: |
          npm ci --ignore-scripts
          npm run test:coverage

      - name: Scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
