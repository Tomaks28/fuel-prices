name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain needs Node >= 22.18 (tsdown); the published package
      # itself targets node18, which the `compat` job below verifies.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check

      # Gates publint + arethetypeswrong. Needs --fail-on-warn (set in the
      # script) or packaging problems are only warnings and CI stays green.
      - run: npm run build:verify

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  compat:
    name: Import on Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      # package.json is required so Node resolves the "exports" map.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Import the ESM build
        run: |
          node -e "import('./dist/index.js').then(m => {
            if (typeof m.VERSION !== 'string') throw new Error('ESM: VERSION missing');
            if (m.getFuelPricesClient() !== m.FuelPricesClient.getInstance()) {
              throw new Error('ESM: singleton mismatch');
            }
            console.log('ESM ok, VERSION =', m.VERSION);
          })"

      - name: Require the CJS build
        run: |
          node -e "
            const m = require('./dist/index.cjs');
            if (typeof m.VERSION !== 'string') throw new Error('CJS: VERSION missing');
            if (m.getFuelPricesClient() !== m.FuelPricesClient.getInstance()) {
              throw new Error('CJS: singleton mismatch');
            }
            console.log('CJS ok, VERSION =', m.VERSION);
          "
