name: Security

on:
  pull_request:
  push:
    branches: [main]
  # New advisories land without the code changing, so scan on a schedule too.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First pass reports everything to code scanning, including severities
      # that must not fail the build.
      - name: Scan and report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: '0'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy.sarif
          category: trivy

      # Second pass is the gate. Uses the cache primed above, so it is cheap.
      - name: Fail on high and critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

  bearer:
    name: Bearer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both steps read `bearer.yml` from the repository root, which is the
      # scanner's own default for --config-file.
      - name: Scan and report
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          scanner: secrets,sast
          format: sarif
          output: bearer.sarif
          exit-code: '0'

      # Bearer writes `results: null` when it finds nothing, which GitHub's
      # SARIF validator rejects. Coerce it to the empty array it requires.
      - name: Normalise empty results
        if: always()
        run: |
          jq '.runs |= map(.results //= [])' bearer.sarif > bearer.normalised.sarif
          mv bearer.normalised.sarif bearer.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: bearer.sarif
          category: bearer

      - name: Fail on high and critical
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          scanner: secrets,sast
          severity: high,critical
          exit-code: '1'
